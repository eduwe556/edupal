{% extends "base.html" %}
{% block title %}Record Fee Payment{% endblock %}
{% block content %}
<h2 class="mb-4">Record Fee Payment</h2>
<div class="card p-4" style="max-width: 600px;">
    <form method="POST" action="/fees/add">
        <div class="mb-3">
            <label class="form-label">Student</label>
            <select class="form-control" name="student_id" required>
                <option value="">-- Select Student --</option>
                {% for student in students %}
                <option value="{{ student.id }}">{{ student.last_name }}, {{ student.first_name }} ({{ student.class_name or 'No Class' }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Amount (₦)</label>
            <input type="number" step="0.01" class="form-control" name="amount" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Payment Date</label>
            <input type="date" class="form-control" name="payment_date" value="{{ current_date }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Note (Optional)</label>
            <input type="text" class="form-control" name="note" placeholder="e.g., First term fees">
        </div>
        <button type="submit" class="btn btn-primary">Save Payment</button>
        <a href="/fees" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
