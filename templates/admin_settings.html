{% extends "base.html" %}
{% block title %}Admin - Settings{% endblock %}
{% block page_title %}Settings{% endblock %}
{% block content %}
<div class="card p-4 mx-auto" style="max-width: 600px;">
    <form method="POST" action="/admin/settings">
        <h5>Subscription Prices</h5>
        <div class="mb-3">
            <label class="form-label">Basic Plan Price (₦)</label>
            <input type="number" class="form-control" name="basic" value="{{ prices.get('basic_price', '30000') }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Silver Plan Price (₦)</label>
            <input type="number" class="form-control" name="silver" value="{{ prices.get('silver_price', '50000') }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Gold Plan Price (₦)</label>
            <input type="number" class="form-control" name="gold" value="{{ prices.get('gold_price', '70000') }}" required>
        </div>
        <h5>Bank Details</h5>
        <div class="mb-3">
            <label class="form-label">Bank Name</label>
            <input type="text" class="form-control" name="bank_name" value="{{ prices.get('bank_name', 'Moniepoint') }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Account Number</label>
            <input type="text" class="form-control" name="bank_account" value="{{ prices.get('bank_account', '9016530108') }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Account Name</label>
            <input type="text" class="form-control" name="bank_account_name" value="{{ prices.get('bank_account_name', 'Taliat Ibrahim Olasunkanmi') }}">
        </div>
        <button type="submit" class="btn btn-primary">Save Settings</button>
    </form>
</div>
{% endblock %}
