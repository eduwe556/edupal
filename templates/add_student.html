{% extends "base.html" %}
{% block title %}Add Student{% endblock %}
{% block page_title %}Add Student{% endblock %}
{% block content %}
<div class="card p-4" style="max-width: 700px;">
    <form method="POST" action="/students/add">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">First Name</label>
                <input type="text" class="form-control" name="first_name" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Last Name</label>
                <input type="text" class="form-control" name="last_name" required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Class</label>
            <select class="form-control" name="class_id">
                <option value="">-- Select Class --</option>
                {% for class in classes %}
                <option value="{{ class.id }}">{{ class.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Parent Phone</label>
                <input type="text" class="form-control" name="parent_phone">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Parent Email</label>
                <input type="email" class="form-control" name="parent_email">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Address</label>
            <input type="text" class="form-control" name="address" placeholder="Home address">
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save Student</button>
            <a href="/students" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
