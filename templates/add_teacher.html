{% extends "base.html" %}
{% block title %}Add Teacher{% endblock %}
{% block page_title %}Add Teacher{% endblock %}
{% block content %}
<div class="card p-4" style="max-width: 600px;">
    <form method="POST" action="/teachers/add">
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" name="name" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Assign Class</label>
            <select class="form-control" name="class_id" required>
                <option value="">-- Select Class --</option>
                {% for class in classes %}
                <option value="{{ class.id }}">{{ class.name }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Create Teacher Account</button>
        <a href="/teachers" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
