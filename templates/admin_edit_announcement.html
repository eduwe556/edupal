{% extends "base.html" %}
{% block title %}Admin - Edit Announcement{% endblock %}
{% block page_title %}Edit Announcement{% endblock %}
{% block content %}
<div class="card p-4 mx-auto" style="max-width: 700px;">
    <form method="POST" action="/admin/announcements/edit/{{ announcement.id }}">
        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" name="title" value="{{ announcement.title }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Content</label>
            <textarea class="form-control" name="content" rows="5" required>{{ announcement.content }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Update Announcement</button>
        <a href="/admin/announcements" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
