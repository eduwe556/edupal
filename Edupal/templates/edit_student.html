{% extends "base.html" %}
{% block title %}Edit Student{% endblock %}
{% block page_title %}Edit Student{% endblock %}
{% block content %}
<div class="card p-4" style="max-width: 700px;">
    <form method="POST" action="/students/edit/{{ student.id }}">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">First Name</label>
                <input type="text" class="form-control" name="first_name" value="{{ student.first_name }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Last Name</label>
                <input type="text" class="form-control" name="last_name" value="{{ student.last_name }}" required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Class</label>
            <select class="form-control" name="class_id">
                <option value="">-- Select Class --</option>
                {% for class in classes %}
                <option value="{{ class.id }}" {% if class.id == student.class_id %}selected{% endif %}>{{ class.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Parent Phone</label>
                <input type="text" class="form-control" name="parent_phone" value="{{ student.parent_phone or '' }}">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Parent Email</label>
                <input type="email" class="form-control" name="parent_email" value="{{ student.parent_email or '' }}">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Address</label>
            <input type="text" class="form-control" name="address" value="{{ student.address or '' }}">
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Update Student</button>
            <a href="/students" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
