{% extends "base.html" %}
{% block title %}Fee Structure{% endblock %}
{% block content %}
<h2 class="mb-4">Set School Fees per Class</h2>

<div class="card p-4">
    <form method="POST" action="/fees/structure">
        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>Class</th>
                        <th>Fee Amount (₦)</th>
                    </tr>
                </thead>
                <tbody>
                    {% for class in classes %}
                    <tr>
                        <td>{{ class.name }}</td>
                        <td>
                            <input type="number" step="0.01" class="form-control" name="fee_{{ class.id }}" value="{{ class_fees.get(class.id, '') }}" placeholder="0.00">
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <button type="submit" class="btn btn-primary">Save Fee Structure</button>
    </form>
</div>
{% endblock %}
