{% extends "base.html" %}
{% block title %}Add Class{% endblock %}
{% block content %}
<h2 class="mb-4">Add Class</h2>
<div class="card p-4" style="max-width: 500px;">
    <form method="POST" action="/classes/add">
        <div class="mb-3">
            <label class="form-label">Class Name</label>
            <input type="text" class="form-control" name="name" placeholder="e.g., Primary 1" required>
        </div>
        <button type="submit" class="btn btn-primary">Save Class</button>
        <a href="/classes" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
