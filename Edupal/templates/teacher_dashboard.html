<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPal - Teacher Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 800px;
            margin-top: 50px;
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .btn-primary {
            background: #4f46e5;
            border: none;
        }
        .btn-primary:hover {
            background: #4338ca;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Welcome, {{ session.teacher_name }}</h2>
            <a href="/teacher/logout" class="btn btn-outline-secondary">Logout</a>
        </div>
        <div class="card p-4">
            <h4>Class: {{ class_name }}</h4>
            <p>Total Students: {{ student_count }}</p>
            <a href="/teacher/attendance" class="btn btn-primary btn-lg">Mark Attendance</a>
        </div>
    </div>
</body>
</html>
